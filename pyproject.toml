[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinerecon"
version = "0.2.0"
description = "CineRecon dataset and single-call evaluator"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["Pillow==12.3.0", "imageio-ffmpeg==0.6.0"]

[project.scripts]
cinerecon = "cinerecon.cli:main"

[tool.setuptools]
packages = ["cinerecon"]
